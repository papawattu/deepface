name: Build Docker Container

# Builds and pushes ghcr.io/papawattu/deepface.
#
# Tagged as 0.0.<run_number> on the default branch (same convention as the
# pixme monolith's build.yml) so Flux Image Automation can auto-deploy it via
# an ImagePolicy (semver 0.0.x) once the ImageRepository/Policy are enabled in
# the homelab repo. Also tagged latest + sha for manual pins / debugging.
#
# The deepface fork's source already carries the null-embedding fix in
# recognition.find() (a reference face with no embedding is skipped from BOTH
# the distances and confidences lists), so a face that fails to embed can never
# break /find. Rebuilding on push to the default branch re-bases the image.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: "${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_id) }}"
      COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: "amd64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=0.0.${{ github.run_number }},enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/${{ github.repository }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ env.BUILD_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
